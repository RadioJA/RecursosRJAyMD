<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Cursos Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050510;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --border-glow: rgba(0, 243, 255, 0.3);
            --text-primary: #e0e0e0;
            --text-secondary: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-only { display: none !important; }
        .admin-only-inline { display: none !important; }
        .admin-only-flex { display: none !important; }

        .is-admin .admin-only { display: block !important; }
        .is-admin .admin-only-inline { display: inline-flex !important; }
        .is-admin .admin-only-flex { display: flex !important; }

        .container { max-width: 1200px; margin: 0 auto; }

        .tech-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 30px; background: var(--panel-bg);
            backdrop-filter: blur(12px); border: 1px solid var(--border-glow);
            border-radius: 16px; margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative; overflow: hidden;
        }

        .tech-header::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
        }

        .logo-container { display: flex; align-items: center; flex: 1; }
        .logo-container.right { justify-content: flex-end; }

        .tech-logo {
            height: 60px; width: auto; object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.4));
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .tech-logo:hover { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.8)); }

        .header-title { text-align: center; flex: 2; }
        .header-title h1 {
            font-family: 'Rajdhani', sans-serif; font-size: 2.2em; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), #ffffff, var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }
        .header-title p { font-size: 0.9em; color: var(--text-secondary); letter-spacing: 1px; margin-top: 5px; }

        .admin-login-btn {
            position: absolute; top: 20px; right: 30px;
            background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-family: 'Rajdhani', sans-serif; font-size: 0.9em;
            font-weight: 600; width: auto; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .admin-login-btn:hover {
            background: var(--neon-cyan); color: var(--dark-bg);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); transform: none;
        }

        .main-content { display: grid; grid-template-columns: 320px 1fr; gap: 25px; }

        .sidebar, .content-area {
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow); border-radius: 16px;
            padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); height: fit-content;
        }

        .sidebar h2 {
            font-family: 'Rajdhani', sans-serif; color: var(--neon-cyan);
            margin-bottom: 20px; font-size: 1.4em; text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 10px;
        }

        .form-group { margin-bottom: 20px; }
        label {
            display: block; margin-bottom: 8px; color: var(--neon-cyan);
            font-weight: 600; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px;
            color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; transition: all 0.3s ease;
        }
        input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        input::placeholder { color: rgba(255, 255, 255, 0.3); }

        button {
            width: 100%; padding: 12px; background: linear-gradient(90deg, var(--neon-cyan), #0066ff);
            color: var(--dark-bg); border: none; border-radius: 8px;
            font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
        button:active { transform: translateY(0); }

        .courses-list { margin-top: 25px; max-height: 60vh; overflow-y: auto; }
        .courses-list::-webkit-scrollbar { width: 6px; }
        .courses-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .courses-list::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }

        .course-item {
            background: rgba(0, 0, 0, 0.3); padding: 15px; margin-bottom: 12px;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
            border-left: 3px solid transparent; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .course-item:hover { background: rgba(0, 243, 255, 0.05); border-left-color: var(--neon-cyan); transform: translateX(5px); }
        .course-item.active {
            background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-cyan);
            border-left-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .course-item-header { display: flex; justify-content: space-between; align-items: center; }
        .course-item-title { font-weight: 600; flex: 1; color: #fff; }
        .course-item-count {
            background: rgba(0, 243, 255, 0.15); color: var(--neon-cyan);
            padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 700; margin-left: 10px;
        }

        .content-header { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); }
        .content-header h2 { font-family: 'Rajdhani', sans-serif; color: var(--neon-cyan); font-size: 1.8em; text-transform: uppercase; }

        .video-player {
            margin-bottom: 30px; background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.2); box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .video-player iframe { width: 100%; height: 450px; border: none; }

        .video-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .video-item {
            background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 12px;
            cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-item:hover {
            background: rgba(0, 243, 255, 0.05); transform: translateY(-5px);
            border-color: rgba(0, 243, 255, 0.3); box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .video-item.active {
            border-color: var(--neon-cyan); background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .video-thumbnail { width: 100%; height: 130px; background: #000; border-radius: 8px; margin-bottom: 12px; overflow: hidden; position: relative; }
        .video-thumbnail img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .video-item:hover .video-thumbnail img { transform: scale(1.05); }

        .video-title {
            font-weight: 600; color: #fff; margin-bottom: 8px; font-size: 0.9em; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .video-actions { gap: 8px; margin-top: 12px; }
        .btn-small { flex: 1; padding: 8px; font-size: 0.8em; border-radius: 6px; width: auto; }
        .btn-edit { background: linear-gradient(90deg, #00c6ff, #0072ff); }
        .btn-delete { background: linear-gradient(90deg, #ff416c, #ff4b2b); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 4em; margin-bottom: 20px; opacity: 0.5; }

        .site-stats {
            margin-top: 25px; padding: 12px 18px; text-align: center;
            color: var(--text-secondary); font-size: 0.85em; letter-spacing: 0.5px;
            border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 10px;
            background: rgba(15, 23, 42, 0.7);
        }
        .site-stats strong { color: var(--neon-cyan); font-family: 'Rajdhani', sans-serif; font-size: 1.15em; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.9); backdrop-filter: blur(5px);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #0f172a; border: 1px solid var(--neon-cyan); border-radius: 16px;
            padding: 30px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 15px;
        }
        .modal-header h3 { font-family: 'Rajdhani', sans-serif; color: var(--neon-cyan); font-size: 1.5em; text-transform: uppercase; }
        .close-btn {
            background: none; border: none; font-size: 1.8em; cursor: pointer;
            color: var(--text-secondary); width: auto; padding: 0; line-height: 1; transition: color 0.3s;
        }
        .close-btn:hover { color: var(--neon-cyan); transform: none; box-shadow: none; }
        .login-error { color: #ff416c; text-align: center; margin-top: 15px; font-size: 0.9em; display: none; font-weight: 600; }

        @media (max-width: 900px) {
            .main-content { grid-template-columns: 1fr; }
            .tech-header { flex-direction: column; gap: 15px; text-align: center; }
            .logo-container, .logo-container.right { justify-content: center; }
            .header-title h1 { font-size: 1.6em; }
            .admin-login-btn { position: static; margin-top: 10px; }
            .video-player iframe { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="tech-header">
            <div class="logo-container">
                <img src="img/rja.png" alt="Logo RJA" class="tech-logo" onerror="this.style.display='none'">
            </div>
            <div class="header-title">
                <h1>Plataforma de Cursos</h1>
                <p>Sistema de Gestión de Aprendizaje</p>
            </div>
            <div class="logo-container right">
                <img src="img/md.png" alt="Logo MD" class="tech-logo" onerror="this.style.display='none'">
            </div>
            <button class="admin-login-btn" id="adminBtn" onclick="toggleLoginModal()">
                <span id="adminBtnText">🔒 Acceso Admin</span>
            </button>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <h2>📚 Cursos Disponibles</h2>
                <div class="form-group admin-only">
                    <label for="courseName">Nuevo Curso</label>
                    <input type="text" id="courseName" placeholder="Ej: Ciberseguridad Básica" onkeydown="if(event.key==='Enter') createCourse()">
                </div>
                <button onclick="createCourse()" class="admin-only">➕ Crear Curso</button>
                <div class="courses-list" id="coursesList"></div>
            </div>

            <div class="content-area">
                <div id="courseContent">
                    <div class="empty-state">
                        <div class="empty-state-icon">💻</div>
                        <h3>Cargando datos...</h3>
                        <p id="mainEmptyMsg">Conectando con la base de datos</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="site-stats" aria-live="polite">
            👁️ Visitas: <strong id="visitCount">...</strong>
        </div>
    </div>

    <!-- Modal de Login Administrador -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔒 Acceso Administrador</h3>
                <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            </div>
            <div class="form-group">
                <label for="adminEmail">Correo Electrónico</label>
                <input type="email" id="adminEmail" placeholder="admin@sistema.com" onkeydown="if(event.key==='Enter') login()">
            </div>
            <div class="form-group">
                <label for="adminPassword">Contraseña</label>
                <input type="password" id="adminPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
            </div>
            <button onclick="login()">Iniciar Sesión</button>
            <p class="login-error" id="loginError">⚠️ Correo o contraseña incorrectos</p>
        </div>
    </div>

    <!-- Modal para agregar/editar video -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Agregar Video</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label for="videoTitle">Título del Video</label>
                <input type="text" id="videoTitle" placeholder="Ej: Módulo 1: Introducción" onkeydown="if(event.key==='Enter') saveVideo()">
            </div>
            <div class="form-group">
                <label for="videoUrl">Enlace de YouTube</label>
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." onkeydown="if(event.key==='Enter') saveVideo()">
            </div>
            <button onclick="saveVideo()">💾 Guardar Video</button>
        </div>
    </div>

    <!-- SCRIPT CONECTADO A SUPABASE -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        // ============================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================
        const supabaseUrl = 'https://irqzaoaamdnbnzzvrncu.supabase.co'
        const supabaseKey = 'sb_publishable_jHdcxE25r5ux-JIR2EK1JQ_veQ_faAF'
        const supabase = createClient(supabaseUrl, supabaseKey)

        let courses = []
        let currentCourseId = null
        let currentVideoId = null
        let editingVideoId = null
        let isAdmin = false

        // Inicializar y escuchar cambios de sesión
        supabase.auth.onAuthStateChange((event, session) => {
            const user = session?.user
            if (user && user.email === 'ministrylion@gmail.com') {
                isAdmin = true
                document.body.classList.add('is-admin')
                document.getElementById('adminBtnText').textContent = '🔓 Cerrar Sesión'
            } else {
                isAdmin = false
                document.body.classList.remove('is-admin')
                document.getElementById('adminBtnText').textContent = '🔒 Acceso Admin'
            }
            updateEmptyMessages()
            renderCourses()
            if (currentCourseId) renderCourseContent()
        })

        // Comprobación inicial de admin y cursos
        checkAdminStatus()
        loadCourses()
        registerVisit()

        async function registerVisit() {
            const counter = document.getElementById('visitCount')
            const { data, error } = await supabase.rpc('increment_site_visits')

            if (error) {
                console.error('Error updating visit counter:', error)
                counter.textContent = 'No disponible'
                return
            }

            counter.textContent = Number(data).toLocaleString('es-ES')
        }

        // ============================================
        // FUNCIONES DE AUTENTICACIÓN
        // ============================================
        async function checkAdminStatus() {
            const { data: { user } } = await supabase.auth.getUser()
            if (user && user.email === 'ministrylion@gmail.com') {
                isAdmin = true
                document.body.classList.add('is-admin')
                document.getElementById('adminBtnText').textContent = '🔓 Cerrar Sesión'
            } else {
                isAdmin = false
                document.body.classList.remove('is-admin')
                document.getElementById('adminBtnText').textContent = '🔒 Acceso Admin'
            }
            updateEmptyMessages()
        }

        window.toggleLoginModal = async function() {
            if (isAdmin) {
                await logout()
            } else {
                document.getElementById('loginModal').classList.add('active')
                document.getElementById('loginError').style.display = 'none'
                document.getElementById('loginError').textContent = '⚠️ Correo o contraseña incorrectos'
                document.getElementById('adminEmail').value = ''
                document.getElementById('adminPassword').value = ''
            }
        }

        window.closeLoginModal = function() {
            document.getElementById('loginModal').classList.remove('active')
        }

        window.login = async function() {
            const email = document.getElementById('adminEmail').value.trim()
            const password = document.getElementById('adminPassword').value.trim()
            const errorMsg = document.getElementById('loginError')

            if (!email || !password) {
                errorMsg.textContent = '⚠️ Por favor ingresa correo y contraseña'
                errorMsg.style.display = 'block'
                return
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password })

            if (error) {
                errorMsg.textContent = '⚠️ Correo o contraseña incorrectos'
                errorMsg.style.display = 'block'
                return
            }

            if (data.user && data.user.email === 'ministrylion@gmail.com') {
                isAdmin = true
                document.body.classList.add('is-admin')
                document.getElementById('adminBtnText').textContent = '🔓 Cerrar Sesión'
                window.closeLoginModal()
                await loadCourses()
            } else {
                await supabase.auth.signOut()
                errorMsg.textContent = '⚠️ No tienes permisos de administrador'
                errorMsg.style.display = 'block'
            }
        }

        window.logout = async function() {
            await supabase.auth.signOut()
            isAdmin = false
            document.body.classList.remove('is-admin')
            document.getElementById('adminBtnText').textContent = '🔒 Acceso Admin'
            await loadCourses()
            if (currentCourseId) renderCourseContent()
        }

        // ============================================
        // FUNCIONES DE CURSOS
        // ============================================
        async function loadCourses() {
            const { data, error } = await supabase
                .from('courses')
                .select(`*, videos:videos(count)`)
                .order('created_at', { ascending: false })

            if (error) {
                console.error('Error loading courses:', error)
                return
            }

            courses = data ? data.map(course => ({
                ...course,
                videos_count: course.videos?.[0]?.count || 0
            })) : []
            
            renderCourses()
            if (currentCourseId) renderCourseContent()
        }

        window.createCourse = async function() {
            const input = document.getElementById('courseName')
            const name = input.value.trim()
            if (!name) {
                alert('Por favor ingresa un nombre para el curso')
                return
            }

            const { data, error } = await supabase
                .from('courses')
                .insert([{ name: name }])
                .select()
                .single()

            if (error) {
                console.error('Error creating course:', error)
                alert('Error al crear el curso: ' + (error.message || 'Verifica permisos de administrador en Supabase'))
                return
            }

            input.value = ''
            await loadCourses()
            if (data && data.id) {
                selectCourse(data.id)
            }
        }

        window.selectCourse = function(courseId) {
            currentCourseId = courseId
            renderCourses()
            renderCourseContent()
        }

        window.deleteCourse = async function(courseId, event) {
            event.stopPropagation()
            if (!confirm('¿Estás seguro de eliminar este curso y todos sus videos?')) return

            const { error } = await supabase.from('courses').delete().eq('id', courseId)

            if (error) {
                console.error('Error deleting course:', error)
                alert('Error al eliminar el curso: ' + (error.message || ''))
                return
            }

            if (currentCourseId === courseId) {
                currentCourseId = null
                document.getElementById('courseContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💻</div>
                        <h3>Selecciona o crea un curso</h3>
                        <p id="mainEmptyMsg">${isAdmin ? "Comienza creando un curso desde el panel izquierdo" : "No hay cursos disponibles en este momento."}</p>
                    </div>
                `
            }
            await loadCourses()
        }

        function renderCourses() {
            const list = document.getElementById('coursesList')
            if (courses.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary); text-align: center; margin-top: 20px;">No hay cursos creados</p>'
                return
            }

            list.innerHTML = courses.map(course => `
                <div class="course-item ${course.id === currentCourseId ? 'active' : ''}" onclick="selectCourse('${course.id}')">
                    <div class="course-item-header">
                        <span class="course-item-title">${course.name}</span>
                        <span class="course-item-count">${course.videos_count}</span>
                        <button class="close-btn admin-only-inline" onclick="deleteCourse('${course.id}', event)" style="font-size: 1.2em; padding: 0; width: auto; color: #ff416c;">×</button>
                    </div>
                </div>
            `).join('')
        }

        // ============================================
        // FUNCIONES DE VIDEOS
        // ============================================
        async function renderCourseContent() {
            const course = courses.find(c => c.id === currentCourseId)
            if (!course) return

            const content = document.getElementById('courseContent')
            
            const { data: videos, error } = await supabase
                .from('videos')
                .select('*')
                .eq('course_id', currentCourseId)
                .order('position', { ascending: true })

            if (error) {
                console.error('Error loading videos:', error)
                return
            }

            if (!videos || videos.length === 0) {
                content.innerHTML = `
                    <div class="content-header"><h2>${course.name}</h2></div>
                    <button onclick="openModal()" class="admin-only" style="margin-bottom: 20px;">➕ Agregar Primer Video</button>
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <h3>No hay videos en este curso</h3>
                        <p>${isAdmin ? "Agrega videos de YouTube para comenzar" : "Este curso aún no tiene videos disponibles."}</p>
                    </div>
                `
                return
            }

            const activeVideo = videos.find(v => v.id === currentVideoId) || videos[0]
            currentVideoId = activeVideo.id

            content.innerHTML = `
                <div class="content-header"><h2>${course.name}</h2></div>
                <button onclick="openModal()" class="admin-only" style="margin-bottom: 20px;">➕ Agregar Video</button>
                <div class="video-player">
                    <iframe src="https://www.youtube.com/embed/${activeVideo.youtube_id}" allowfullscreen></iframe>
                </div>
                <div class="video-list">
                    ${videos.map(video => `
                        <div class="video-item ${video.id === currentVideoId ? 'active' : ''}" onclick="playVideo('${video.id}')">
                            <div class="video-thumbnail">
                                <img src="https://img.youtube.com/vi/${video.youtube_id}/mqdefault.jpg" alt="${video.title}">
                            </div>
                            <div class="video-title">${video.title}</div>
                            <div class="video-actions admin-only-flex">
                                <button class="btn-small btn-edit" onclick="editVideo('${video.id}', event)">✏️ Editar</button>
                                <button class="btn-small btn-delete" onclick="deleteVideo('${video.id}', event)">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `
        }

        window.playVideo = function(videoId) {
            currentVideoId = videoId
            renderCourseContent()
        }

        window.openModal = async function(videoId = null) {
            editingVideoId = videoId
            const modal = document.getElementById('videoModal')
            const title = document.getElementById('modalTitle')
            const videoTitleInput = document.getElementById('videoTitle')
            const videoUrlInput = document.getElementById('videoUrl')

            if (videoId) {
                const { data } = await supabase.from('videos').select('*').eq('id', videoId).maybeSingle()
                if (data) {
                    title.textContent = 'Editar Video'
                    videoTitleInput.value = data.title
                    videoUrlInput.value = data.youtube_url
                }
            } else {
                title.textContent = 'Agregar Video'
                videoTitleInput.value = ''
                videoUrlInput.value = ''
            }
            modal.classList.add('active')
        }

        window.closeModal = function() {
            document.getElementById('videoModal').classList.remove('active')
            editingVideoId = null
        }

        window.saveVideo = async function() {
            const title = document.getElementById('videoTitle').value.trim()
            const url = document.getElementById('videoUrl').value.trim()

            if (!title || !url) {
                alert('Por favor completa todos los campos')
                return
            }

            const youtubeId = extractVideoId(url)
            if (!youtubeId) {
                alert('Por favor ingresa un enlace válido de YouTube')
                return
            }

            if (editingVideoId) {
                const { error } = await supabase
                    .from('videos')
                    .update({ title: title, youtube_url: url, youtube_id: youtubeId })
                    .eq('id', editingVideoId)

                if (error) {
                    console.error('Error updating video:', error)
                    alert('Error al actualizar el video: ' + (error.message || ''))
                    return
                }
            } else {
                const { data: maxPosition } = await supabase
                    .from('videos')
                    .select('position')
                    .eq('course_id', currentCourseId)
                    .order('position', { ascending: false })
                    .limit(1)
                    .maybeSingle()

                const newPosition = (maxPosition && maxPosition.position !== null) ? maxPosition.position + 1 : 0

                const { error } = await supabase
                    .from('videos')
                    .insert([{
                        course_id: currentCourseId,
                        title: title,
                        youtube_url: url,
                        youtube_id: youtubeId,
                        position: newPosition
                    }])

                if (error) {
                    console.error('Error creating video:', error)
                    alert('Error al crear el video: ' + (error.message || ''))
                    return
                }
            }

            window.closeModal()
            await loadCourses()
            await renderCourseContent()
        }

        window.editVideo = function(videoId, event) {
            event.stopPropagation()
            window.openModal(videoId)
        }

        window.deleteVideo = async function(videoId, event) {
            event.stopPropagation()
            if (!confirm('¿Estás seguro de eliminar este video?')) return

            const { error } = await supabase.from('videos').delete().eq('id', videoId)

            if (error) {
                console.error('Error deleting video:', error)
                alert('Error al eliminar el video: ' + (error.message || ''))
                return
            }

            if (currentVideoId === videoId) currentVideoId = null
            await loadCourses()
            await renderCourseContent()
        }

        function extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /youtube\.com\/shorts\/([^&\n?#]+)/
            ]
            for (const pattern of patterns) {
                const match = url.match(pattern)
                if (match) return match[1]
            }
            return null
        }

        function updateEmptyMessages() {
            const mainMsg = document.getElementById('mainEmptyMsg')
            if (mainMsg) {
                mainMsg.textContent = isAdmin ? "Comienza creando un curso desde el panel izquierdo" : "No hay cursos disponibles en este momento."
            }
        }

        // Hacer funciones disponibles globalmente para los onclick del HTML
        window.createCourse = createCourse;
        window.selectCourse = selectCourse;
        window.deleteCourse = deleteCourse;
        window.playVideo = playVideo;
        window.editVideo = editVideo;
        window.deleteVideo = deleteVideo;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.saveVideo = saveVideo;

        // Cerrar modales al hacer clic fuera
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) window.closeModal()
        })
        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) window.closeLoginModal()
        })
    </script>
</body>
</html>
